<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recess Lab Premium - Play 250+ Best Unblocked Games</title>
  <meta name="description" content="Discover and play a curated collection of 250+ premium unblocked games, including Snow Rider 3D, Block Blast, Slope, and more. Free to play at school or work with no downloads.">
  <meta name="keywords" content="recess lab, unblocked games, recess lab premium, html5 games, slope unblocked, snow rider 3d unblocked, school games">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index, follow">
  
  <!-- Styling Sheet -->
  <link rel="stylesheet" href="index.css?v=1.0.1">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="app-container header-content">
      <!-- Logo -->
      <a href="#" class="logo-container">
        <div class="logo-glow"></div>
        <h1 class="logo-text">Recess Lab</h1>
      </a>
      
      <!-- Utility Actions -->
      <div class="header-actions">
        <!-- Search bar -->
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search games...">
        </div>
        
        <!-- Dark/Light Mode Switcher -->
        <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24">
            <!-- Default Moon Icon -->
            <path d="M12.3 22h-.1c-5.4 0-10-4.6-10-10 0-4.3 2.9-8.1 7.1-9.3.5-.1 1 .1 1.2.6.2.5 0 1.1-.4 1.4-2.8 2-4.1 5.6-3.1 9 1 3.4 4.1 5.9 7.6 5.9 1.6 0 3.1-.5 4.4-1.4.4-.3.9-.3 1.2.1.3.4.3.9 0 1.2-1.9 2.5-4.8 3.9-7.9 3.9z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Category Selection Bar -->
  <nav class="category-bar">
    <div class="app-container category-list" id="category-list">
      <!-- Generated Dynamically -->
    </div>
  </nav>

  <!-- Main View Area -->
  <main class="app-container">

    <!-- HOME SCREEN VIEW -->
    <div id="home-view" class="view-section">
      <!-- Featured Banner -->
      <section id="featured-banner" class="featured-banner">
        <!-- Generated Dynamically -->
      </section>
      
      <!-- Games Section -->
      <section class="main-content">
        <div class="section-header">
          <h2>All Games</h2>
          <span id="results-count" class="results-count">Loading games...</span>
        </div>
        
        <!-- Game Cards Grid -->
        <div id="game-grid" class="game-grid">
          <!-- Generated Dynamically -->
        </div>
      </section>
    </div>

    <!-- GAME PLAY SCREEN VIEW -->
    <div id="play-view" class="view-section play-view-container hidden">
      <!-- Play screen header -->
      <header class="play-header">
        <div class="back-btn-container">
          <button id="back-btn" class="btn-secondary">
            <svg viewBox="0 0 24 24">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back to Library
          </button>
          <div class="play-title-group">
            <h1 id="game-title">Game Title</h1>
            <p id="game-category">Category</p>
          </div>
        </div>
        
        <!-- Controls & Favorites -->
        <div class="control-group">
          <!-- Favorite button -->
          <button id="fav-toggle-btn" class="btn-secondary">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span class="btn-label">Add to Favorites</span>
          </button>
        </div>
      </header>

      <!-- Gameplay Box Wrapper -->
      <section class="game-stage-wrapper">
        <div id="iframe-wrapper" class="iframe-container">
          <iframe id="game-iframe" src="about:blank" allowfullscreen="true" scrolling="no" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads allow-storage-access-by-user-activation"></iframe>
        </div>
        
        <!-- Frame toolbar controls -->
        <div class="game-control-bar">
          <!-- Left side controls -->
          <div class="control-group">
            <button id="reload-btn" class="btn-control">
              <svg viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
              </svg>
              Reload
            </button>
            <button id="theater-btn" class="btn-control">
              <svg viewBox="0 0 24 24">
                <path d="M19 12h-2v3h-3v2h5v-5zM7 9h3V7H5v5h2V9zm14-6H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/>
              </svg>
              <span class="btn-label">Theater Mode</span>
            </button>
            <button id="fullscreen-btn" class="btn-control">
              <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
              Fullscreen
            </button>
          </div>
          
          <!-- Rating Panel -->
          <div class="control-group">
            <div class="rating-widget">
              <!-- Up vote -->
              <button id="like-btn" class="rating-btn" aria-label="Like Game">
                <svg viewBox="0 0 24 24">
                  <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
                </svg>
              </button>
              
              <!-- Percent bar -->
              <div class="rating-bar-container">
                <div id="like-ratio-bar" class="rating-bar-fill"></div>
              </div>
              
              <!-- Down vote -->
              <button id="dislike-btn" class="rating-btn" aria-label="Dislike Game">
                <svg viewBox="0 0 24 24">
                  <path d="M19 15h4V3h-4v12zm-3-1l-3.02-7.05C12.68 6.22 11.97 5.72 11.13 5.72H2.13C1.03 5.72.13 6.62.13 7.72V9.46c0 .26.05.5.14.73l3.02 7.05C3.59 17.96 4.3 18.46 5.13 18.46H14.13c1.1 0 2-.9 2-2H22.44c-.27-.27-.44-.65-.44-1.06l.03-.32.95-4.57c0-1.1-.9-2-2-2z"/>
                </svg>
              </button>
              
              <!-- Ratio text counter -->
              <span class="rating-counts">
                <span id="like-count">0</span> / <span id="dislike-count">0</span>
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- Recommended Games section -->
      <section class="more-games-section">
        <h3 class="more-games-title">Recommended Games</h3>
        <div id="recommended-grid" class="game-grid">
          <!-- Generated Dynamically -->
        </div>
      </section>
    </div>

  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="app-container footer-content">
      <p>&copy; 2026 Recess Lab Premium. Built with maximum performance.</p>
      <div class="footer-links">
        <a href="#/about-us">About Us</a>
        <a href="#/privacy-policy">Privacy Policy</a>
        <a href="#/dmca">DMCA</a>
        <a href="#/contact-us">Contact Us</a>
      </div>
    </div>
  </footer>

  <!-- Application Script -->
  <script src="app.js?v=1.0.1"></script>
</body>
</html>
